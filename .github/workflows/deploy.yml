name: Deploy Application to Alibaba Cloud ECS

on:
  push:
    branches:
      - master
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Deploy to ECS via SSH
        uses: appleboy/ssh-action@v1.0.0
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USERNAME }}
          password: ${{ secrets.SERVER_PASSWORD }}
          script: |
            # 1. Ensure Docker is installed on ECS
            if ! command -v docker &> /dev/null; then
              curl -fsSL https://get.docker.com -o get-docker.sh
              sh get-docker.sh
            fi

            # 2. Setup project directory on server
            mkdir -p ~/my-app
            cd ~/my-app

            # 3. Pull latest code from GitHub
            if [ -d ".git" ]; then
              git pull origin master || git pull origin main
            else
              git clone https://github.com/AnusAkhtar55/cloud-cicd-app.git .
            fi

            # 4. Rebuild & Restart Docker Container
            docker stop my-app-container || true
            docker rm my-app-container || true
            docker build -t cloud-cicd-app:latest .
            docker run -d -p 5000:5000 --name my-app-container cloud-cicd-app:latest
